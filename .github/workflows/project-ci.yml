name: Project CI
on: workflow_dispatch
jobs:
  build-test:
    runs-on: [self-hosted, Windows, X64, simeng]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fayisd/simeng-company
          token: ${{ secrets.PROJECT_TOKEN }}
          ref: master
      - name: Dotnet info
        run: dotnet --info
      - name: Restore
        run: dotnet restore SimEng.sln
      - name: Build
        run: dotnet build SimEng.sln -c Release --no-restore
      - name: Test
        run: dotnet test SimEng.sln -c Release --no-build
